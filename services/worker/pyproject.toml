[project]
name = "tattoo-creator-worker"
version = "0.0.0"
description = "Imaging and generation worker for Tattoo Creator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "tattoo-contracts",
    "httpx2>=0.28.0",
    "cryptography>=45.0.0",
    "pillow>=11.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "uvicorn>=0.31.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "piexif>=1.1.3",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.uv.sources]
# Path dependency into the contracts module. The worker consumes the contract; it never
# redefines it (ARCH-INV-002: contracts depends on nothing, everything depends on it).
tattoo-contracts = { path = "../../contracts/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["app"]

[[tool.mypy.overrides]]
# piexif ships no type information. Used only in tests, to build EXIF-bearing fixtures.
module = ["piexif.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app", "generation", "flash", "media", "safety"]
