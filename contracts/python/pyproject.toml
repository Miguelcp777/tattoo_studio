[project]
name = "tattoo-contracts"
version = "0.0.0"
description = "Shared cross-runtime contracts for Tattoo Creator"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.82.0",
    "mypy>=1.11.0",
    "types-jsonschema>=4.23.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tattoo_contracts"]
# Without py.typed, mypy treats this package as untyped in every consumer, which
# silently disables checking across the most important boundary in the system.
artifacts = ["tattoo_contracts/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated by datamodel-code-generator. Its output is not ours to restyle, and
# reformatting it would fight the generator on every regeneration.
extend-exclude = ["tattoo_contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated by datamodel-code-generator; its output is not ours to restyle.
"tattoo_contracts/generated/*" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["tattoo_contracts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
